<c-vars limited="" usage="" limit_message="" />
<div class="voice" id="voice" data-state="listening" data-command-url="{% url 'voice:command' %}" data-undo-url="{% url 'voice:undo' 0 %}"
     data-review-url="{% url 'board:review' %}" data-settings-url="{% url 'board:settings' %}" data-limit-message="{{ limit_message }}"
     data-percent="{{ usage.percent|default:0 }}" data-left="{{ usage.left }}" data-limited="{% if limited %}1{% endif %}" role="region" aria-label="Voice mode" hidden>
  <div class="voice__edge" aria-hidden="true"></div>
  <div class="voice__arc" aria-hidden="true"></div>
  <div class="voice__stage">
    <p class="voice__heard" id="voice-heard" aria-live="off"></p>
    <p class="voice__reply" id="voice-reply" role="status" aria-live="polite"></p>
    <p class="voice__meta" hidden><span class="voice__hint" id="voice-hint"></span><button type="button" class="voice__undo" id="voice-undo" hidden>Undo</button></p>
    {# The way to stop is here, at the foot of the arch, where you are looking. The mic in the top bar is only for starting. #}
    <button type="button" class="voice__stop" id="voice-stop" data-action="voice-toggle" aria-label="Stop voice mode" title="Stop (Esc)"><span aria-hidden="true"></span></button>
  </div>
</div>
{# The way into voice mode and out of it: at the foot of the screen, between the two typing boxes, where a hand rests. #}
<button type="button" class="voice-dock" id="voice-dock" data-action="voice-toggle" aria-label="Voice mode" title="Voice mode (V)" aria-pressed="false" aria-keyshortcuts="v">
  <c-ui.icon name="mic" size="20" sw="1.7" /><span class="voice-dock__label">Voice</span>
</button>

<dl class="shortcuts">
  <dt class="shortcuts__keys"><kbd>↑</kbd> <kbd>↓</kbd></dt>
  <dd class="shortcuts__what">Move through todos</dd>
  <dt class="shortcuts__keys"><kbd>⇧</kbd> <kbd>↑</kbd> <kbd>↓</kbd></dt>
  <dd class="shortcuts__what">Move a todo up or down</dd>
  <dt class="shortcuts__keys"><kbd>N</kbd></dt>
  <dd class="shortcuts__what">New todo</dd>
  <dt class="shortcuts__keys"><kbd>/</kbd></dt>
  <dd class="shortcuts__what">Search</dd>
  <dt class="shortcuts__keys"><kbd>↵</kbd></dt>
  <dd class="shortcuts__what">Add, send, rename</dd>
  <dt class="shortcuts__keys"><kbd>Esc</kbd></dt>
  <dd class="shortcuts__what">Close, cancel</dd>
</dl>

<c-vars user />
<header class="topbar">
  <c-ui.logo class="topbar__brand" />
  <div class="topbar__actions">
    <c-ui.icon-button label="Scheduled" title="Scheduled" data-action="menu-close" hx-get="{% url 'scheduled:index' %}" hx-target="#overlay" hx-swap="innerHTML"><c-ui.icon name="repeat" /></c-ui.icon-button>
    <c-ui.icon-button label="Review your todos" title="Review" data-action="menu-close" hx-get="{% url 'board:review' %}" hx-target="#overlay" hx-swap="innerHTML"><c-ui.icon name="review" /></c-ui.icon-button>
    <button type="button" class="topbar__account" aria-label="Account and shortcuts" aria-haspopup="true" aria-controls="account-menu" data-action="menu-toggle"><span class="avatar">{{ user.initial }}</span></button>
    <div class="account-menu" id="account-menu">
      <div class="account-menu__section">
        {% if user.is_guest %}
        <span class="account-menu__name">{{ user.display_name }}</span>
        <span class="account-menu__detail">Your todos live in this browser.</span>
        <a class="text-btn account-menu__action" href="{% url 'accounts:login' %}" title="Sign in to keep your todos">Sign in to keep them</a>
        {% else %}
        <span class="account-menu__name">{{ user.display_name }}</span>
        <span class="account-menu__detail">{{ user.email }}</span>
        {% endif %}
      </div>
      <div class="account-menu__section">
        <span class="eyebrow">Shortcuts</span>
        <c-layout.shortcuts />
      </div>
      <div class="account-menu__section">
        <c-ui.text-button class="account-menu__action" data-action="menu-close" hx-get="{% url 'board:settings' %}" hx-target="#overlay" hx-swap="innerHTML">Settings</c-ui.text-button>
        {% if not user.is_guest %}
        <c-ui.text-button class="account-menu__action" hx-post="{% url 'accounts:logout' %}" hx-swap="none">Log out</c-ui.text-button>
        {% endif %}
      </div>
    </div>
  </div>
</header>

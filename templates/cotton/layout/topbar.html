<c-vars user voice="" />
<header class="topbar">
  <a class="topbar__home" href="{% url 'board:home' %}?stay=1" aria-label="Miller home"><c-ui.logo class="topbar__brand" /></a>
  <div class="topbar__actions">
    {% if voice %}<c-ui.icon-button class="topbar__voice" label="Voice mode" title="Voice mode (V)" data-action="voice-toggle" aria-pressed="false" aria-keyshortcuts="v"><c-ui.icon name="mic" /></c-ui.icon-button>{% endif %}
    <c-ui.icon-button label="All todos: past and scheduled" title="All todos" data-action="menu-close" hx-get="{% url 'board:review' %}" hx-target="#overlay" hx-swap="innerHTML"><c-ui.icon name="todos" /></c-ui.icon-button>
    <button type="button" class="topbar__account" aria-label="Account" aria-haspopup="true" aria-controls="account-menu" data-action="menu-toggle"><span class="avatar">{{ user.initial }}</span></button>
    <div class="account-menu" id="account-menu">
      <div class="account-menu__section">
        {% if user.is_guest %}
        <span class="account-menu__name">{{ user.display_name }}</span>
        <span class="account-menu__detail">Your todos live in this browser.</span>
        <a class="text-btn account-menu__action" href="{% url 'accounts:login' %}" title="Sign in to keep your todos">Sign in to keep them</a>
        {% else %}
        <span class="account-menu__name">{{ user.display_name }}</span>
        <span class="account-menu__detail">{{ user.email }}</span>
        {% endif %}
      </div>
      <div class="account-menu__section">
        <c-ui.text-button class="account-menu__action" data-action="menu-close" hx-get="{% url 'board:settings' %}" hx-target="#overlay" hx-swap="innerHTML">Settings</c-ui.text-button>
        {% if not user.is_guest %}
        <c-ui.text-button class="account-menu__action" hx-post="{% url 'accounts:logout' %}" hx-swap="none">Log out</c-ui.text-button>
        {% endif %}
      </div>
      <div class="account-menu__section account-menu__legal">
        <a href="{% url 'privacy' %}" target="_blank" rel="noopener">Privacy</a><span aria-hidden="true">·</span><a href="{% url 'terms' %}" target="_blank" rel="noopener">Terms</a>
      </div>
    </div>
  </div>
</header>

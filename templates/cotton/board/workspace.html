<c-vars rows current comments today_label="" undo="" oob="" recorder="" transcript="" can_record="" />
<div class="board" id="workspace"{% if oob %} hx-swap-oob="true"{% endif %}
     hx-get="{% url 'board:workspace' %}" hx-trigger="board-changed from:body" hx-include="#board-state" hx-swap="outerHTML">
  <c-todos.list :rows="rows" :current="current" :today_label="today_label" />
  <c-board.thread :current="current" :comments="comments" :recorder="recorder" :transcript="transcript" />
  {% if can_record %}
  {# Today's meetings still to start: recorder.js nudges "it started: record the call?" at each start, from this tab. #}
  <div hidden data-meeting-nudges>{% for row in rows %}{% if row.is_meeting and not row.is_done and row.starts_iso %}<span data-nudge-start="{{ row.starts_iso }}" data-nudge-title="{{ row.title }}" data-nudge-url="{% url 'recordings:start' row.id %}" data-nudge-todo="{{ row.id }}"></span>{% endif %}{% endfor %}</div>
  {% endif %}
  <c-todos.toast :undo="undo" />
  <form id="board-state" hidden><input type="hidden" name="t" value="{{ current.id|default:'' }}"></form>
</div>

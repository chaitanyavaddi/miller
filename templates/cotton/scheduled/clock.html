{% comment %}The time picker, drawn like the calendar: hour, minute, am or pm. scheduled.js writes the pick into the row's data-at-time.{% endcomment %}
<div class="popover__title popover__title--time">Hour</div>
<div class="popover__grid popover__grid--time"><button type="button" class="popover__day" data-pick-hour="1">1</button><button type="button" class="popover__day" data-pick-hour="2">2</button><button type="button" class="popover__day" data-pick-hour="3">3</button><button type="button" class="popover__day" data-pick-hour="4">4</button><button type="button" class="popover__day" data-pick-hour="5">5</button><button type="button" class="popover__day" data-pick-hour="6">6</button><button type="button" class="popover__day" data-pick-hour="7">7</button><button type="button" class="popover__day" data-pick-hour="8">8</button><button type="button" class="popover__day" data-pick-hour="9">9</button><button type="button" class="popover__day" data-pick-hour="10">10</button><button type="button" class="popover__day" data-pick-hour="11">11</button><button type="button" class="popover__day" data-pick-hour="12">12</button></div>
<div class="popover__title popover__title--time">Minute</div>
<div class="popover__grid popover__grid--time"><button type="button" class="popover__day" data-pick-minute="0">00</button><button type="button" class="popover__day" data-pick-minute="5">05</button><button type="button" class="popover__day" data-pick-minute="10">10</button><button type="button" class="popover__day" data-pick-minute="15">15</button><button type="button" class="popover__day" data-pick-minute="20">20</button><button type="button" class="popover__day" data-pick-minute="25">25</button><button type="button" class="popover__day" data-pick-minute="30">30</button><button type="button" class="popover__day" data-pick-minute="35">35</button><button type="button" class="popover__day" data-pick-minute="40">40</button><button type="button" class="popover__day" data-pick-minute="45">45</button><button type="button" class="popover__day" data-pick-minute="50">50</button><button type="button" class="popover__day" data-pick-minute="55">55</button></div>
<div class="popover__foot">
  <button type="button" class="popover__day" data-pick-meridiem="am">am</button>
  <button type="button" class="popover__day" data-pick-meridiem="pm">pm</button>
  <button type="button" class="popover__day popover__none" data-pick-no-time>No time</button>
</div>

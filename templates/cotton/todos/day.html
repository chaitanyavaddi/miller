<c-vars day current="" presets="" />
<section class="day{% if day.is_today %} day--today{% endif %}{% if day.is_later %} day--later{% endif %}" data-day="{{ day.key }}" aria-label="{% if day.is_today %}Today{% else %}{{ day.label }}{% endif %}">
  {% if day.is_later %}
  <div class="day__head">
    <span class="day__label">later · <span data-later-count>{{ day.task_count }} todo{{ day.task_count|pluralize }}</span></span>
    <button type="button" class="text-btn text-btn--small day__toggle" data-action="later-toggle" aria-expanded="false">show</button>
  </div>
  {% elif not day.is_today %}
  <div class="day__head"><span class="day__label">{{ day.label }}</span></div>
  {% endif %}
  <div class="day__rows">
    {% for row in day.rows %}<c-todos.row :row="row" :current="current" />{% endfor %}
  </div>
</section>

<c-vars presets />
<div class="remind-menu" role="menu" aria-label="Remind me" hidden>
  {% for preset in presets %}
  <button type="button" role="menuitem" class="remind-menu__item" data-remind-preset="{{ preset.key }}" data-remind-label="{{ preset.label }}">
    <span>{{ preset.label }}</span><span class="remind-menu__hint">{{ preset.hint }}</span>
  </button>
  {% endfor %}
  <button type="button" role="menuitem" class="remind-menu__item" data-action="remind-pick">Pick a time…</button>
  <input type="datetime-local" class="remind-menu__pick" aria-label="Remind me at" hidden>
</div>

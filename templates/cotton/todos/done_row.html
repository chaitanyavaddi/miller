<c-vars row reopen_index />
<div class="todo-row todo-row--done">
  <div class="todo-row__main">
    <span class="todo-row__pos" aria-hidden="true"></span>
    <span class="todo-row__title" title="{{ row.title }}">{{ row.title }}</span>
    <span class="todo-row__age" title="Closed">{{ row.closed_on }}</span>
  </div>
  <span class="todo-row__actions">
    <button type="button" class="todo-row__action" aria-label="Reopen {{ row.title }}" title="Reopen"
            hx-post="{% url 'board:todo-reopen' row.id %}" hx-vals='{"index": {{ reopen_index }}}' hx-include="#board-state" hx-target="#workspace" hx-swap="outerHTML">
      <c-ui.icon name="reopen" size="13" sw="1.7" />
    </button>
  </span>
</div>

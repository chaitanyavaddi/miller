<c-vars row presets="" />
<div class="reminder" id="reminder">
  <form id="remind-form" class="reminder__form" data-remind-scope data-remind-submit hx-post="{% url 'board:todo-remind' row.id %}" hx-include="#board-state" hx-target="#workspace" hx-swap="outerHTML">
    {% csrf_token %}
    <input type="hidden" name="remind_preset">
    <input type="hidden" name="remind_at">
    {% if row.remind_label %}
    <c-ui.icon name="bell" size="12" sw="1.6" />
    <button type="button" class="reminder__when" data-action="remind-open" title="Change the reminder" aria-haspopup="menu">{{ row.remind_label }}</button>
    <button type="button" class="text-btn text-btn--small reminder__clear" data-action="remind-clear">Clear</button>
    {% endif %}
    <c-todos.remind-menu :presets="presets" />
  </form>
  <c-ui.messages />
</div>
